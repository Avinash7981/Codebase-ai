services:
  - type: web
    name: codebase-ai
    env: python
    buildCommand: |
      # Build Frontend
      cd frontend
      npm install
      npm run build
      cd ..
      # Install Backend Dependencies
      cd backend
      pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: NODE_VERSION
        value: 18.0.0
